name: Tests and Deployment

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Execution lane selected by RunnerRouter (or manually)"
        required: true
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - hosted
      run_ui:
        description: "Run UI tests"
        required: false
        default: "false"

jobs:
  dev-tests:
    if: github.ref == 'refs/heads/dev'
    runs-on: ${{ fromJSON(inputs.runner == 'self-hosted' && '["self-hosted","linux","x64","docker-builder"]' || '["ubuntu-latest"]') }}
    container:
      image: ${{ inputs.runner == 'self-hosted' && 'mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim' || '' }}
      options: --security-opt=no-new-privileges
    steps:
      - name: Prepare isolated self-hosted environment
        if: ${{ runner.environment == 'self-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git gzip tar unzip xz-utils
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet restore SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj
      - name: Run fast tests (Unit + Integration + API-Smoke)
        env:
          BASE_URL: http://127.0.0.1:5123
          USE_TEST_FACTORY: '1'
          RUN_UI_TESTS: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=Unit|TestCategory=Integration|TestCategory=API-Smoke" --logger "trx;LogFileName=dev.trx"
      - name: Integration coverage (scoped)
        shell: bash
        env:
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=Integration" \
            --settings coverlet.integration.runsettings
      - name: API coverage (scoped via Include)
        shell: bash
        env:
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=API-Smoke" \
            --settings coverlet.api.runsettings \
            --results-directory SocksShoppingStore.Tests/TestResults/CoverageApi
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-dev
          path: |
            allure-results
            **/allure-results
      - name: Upload Integration coverage (Cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-dev
          path: |
            **/TestResults/**/coverage.cobertura.xml
      - name: Upload API coverage (Cobertura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-dev
          path: |
            **/TestResults/CoverageApi/**/coverage.cobertura.xml

  main-tests:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet restore SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj
      - name: Install coverlet.console tool
        run: dotnet tool update --global coverlet.console
      - name: Start app (HTTP)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          RateLimiting__GlobalPerMinute: '1000'
          RateLimiting__ApiPerMinute: '1000'
          FreeTier__Enabled: 'false'
          HttpsRedirect__Enabled: 'false'
        run: |
          # Build first to surface compile errors in logs
          dotnet build SocksShoppingStore/SocksShoppingStore.csproj -c Release
          # Start app and capture logs
          nohup bash -c "dotnet run -c Release --project SocksShoppingStore/SocksShoppingStore.csproj --urls http://127.0.0.1:5123 --no-launch-profile" > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then echo up; break; fi
            sleep 1
          done
          if ! curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then
            echo 'App failed to start'; echo '--- app.log (tail) ---'; tail -n 200 app.log || true; exit 1;
          fi
      - name: Run non-UI tests (coverage)
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '0'
          IGNORE_CERT_ERRORS: '0'
          USE_TEST_FACTORY: '1'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=Unit|TestCategory=Integration|TestCategory=API-Smoke" \
            --logger "trx;LogFileName=main.trx" \
            --settings coverlet.runsettings \
            --results-directory SocksShoppingStore.Tests/TestResults/Coverage
      - name: Run UI smoke tests (no coverage)
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '1'
          IGNORE_CERT_ERRORS: '0'
          USE_TEST_FACTORY: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release \
            --filter "TestCategory=UI-Smoke" \
            --logger "trx;LogFileName=ui.trx" \
            --results-directory SocksShoppingStore.Tests/TestResults/UI
      - name: Aggregate Allure results
        shell: bash
        run: |
          rm -rf allure-results || true
          mkdir -p allure-results
          # Copy all allure-results produced by tests into a single folder
          find . -type d -name "allure-results" | while read d; do
            cp -r "$d"/. allure-results/ || true
          done
          echo "Aggregated files:"; ls -la allure-results || true

      - name: Setup Java (for Allure CLI)
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VER=2.24.0
          curl -sSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/$VER/allure-$VER.tgz
          sudo tar -zxf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-$VER/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure report
        if: success()
        run: |
          allure generate --clean allure-results -o allure-report

      - name: Install ReportGenerator CLI (local)
        if: success()
        run: |
          dotnet tool update --tool-path ./tools dotnet-reportgenerator-globaltool --version 5.4.18

      - name: Generate Coverage HTML (CLI)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ./tools/reportgenerator \
            -reports:"**/coverage.cobertura.xml;**/coverage.opencover.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;Badge" || echo "COVERAGE_FAILED=1" >> $GITHUB_ENV

      - name: Add coverage metrics to Allure environment
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Generate TextSummary to parse key metrics (do not create files)
          summary=$(./tools/reportgenerator -reports:"**/coverage.cobertura.xml;**/coverage.opencover.xml" -targetdir:"coverage-report" -reporttypes:"TextSummary" 2>&1 || true)
          line=$(echo "$summary" | sed -n 's/^.*Line coverage:[[:space:]]*\([0-9.]*%\).*/\1/p' | head -n1)
          branch=$(echo "$summary" | sed -n 's/^.*Branch coverage:[[:space:]]*\([0-9.]*%\).*/\1/p' | head -n1)
          method=$(echo "$summary" | sed -n 's/^.*Method coverage:[[:space:]]*\([0-9.]*%\).*/\1/p' | head -n1)
          class=$(echo "$summary" | sed -n 's/^.*Class coverage:[[:space:]]*\([0-9.]*%\).*/\1/p' | head -n1)
          mkdir -p allure-results
          {
            [ -n "$line" ] && echo "Coverage.Line=$line" || true
            [ -n "$branch" ] && echo "Coverage.Branch=$branch" || true
            [ -n "$method" ] && echo "Coverage.Method=$method" || true
            [ -n "$class" ] && echo "Coverage.Class=$class" || true
          } > allure-results/environment.properties

      - name: Build Pages site (Allure + Coverage)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site || true
          mkdir -p site/allure site/coverage
          cp -r allure-report/* site/allure/ || true
          if [ -d coverage-report ] && ls -1 coverage-report/* >/dev/null 2>&1; then
            cp -r coverage-report/* site/coverage/ || true
          else
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8" />' \
              '  <title>Coverage Unavailable</title>' \
              '</head>' \
              '<body>' \
              '  <h1>Coverage Unavailable</h1>' \
              '  <p>The coverage report was not generated for this run.</p>' \
              '</body>' \
              '</html>' \
              > site/coverage/index.html
          fi
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="en">' \
            '<head>' \
            '  <meta charset="utf-8" />' \
            '  <title>Test Reports</title>' \
            '</head>' \
            '<body>' \
            '  <h1>Test Reports</h1>' \
            '  <ul>' \
            '    <li><a href="allure/index.html">Allure Report</a></li>' \
            '    <li><a href="coverage/index.html">Coverage Report</a></li>' \
            '  </ul>' \
            '</body>' \
            '</html>' \
            > site/index.html

      - name: Deploy Reports to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages

      - name: Publish app (Release)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet publish SocksShoppingStore/SocksShoppingStore.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        if: success() && github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
      - name: UI coverage (instrument server with coverlet) and run UI smoke
        if: success()
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          dotnet build SocksShoppingStore/SocksShoppingStore.csproj -c Release
          COVERLET=~/.dotnet/tools/coverlet
          APPDLL="SocksShoppingStore/bin/Release/net8.0/SocksShoppingStore.dll"
          $COVERLET "$APPDLL" \
            --target "dotnet" \
            --targetargs "$APPDLL --urls http://127.0.0.1:5123" \
            --format cobertura \
            --output "coverage-ui/coverage.cobertura.xml" \
            --include "[SocksShoppingStore]SocksShoppingStore.Controllers.*;[SocksShoppingStore]SocksShoppingStore.Services.*;[SocksShoppingStore]SocksShoppingStore.Data.*;[SocksShoppingStore]SocksShoppingStore.Middleware.*;[SocksShoppingStore]SocksShoppingStore.RequestMetrics*" \
            --exclude "[SocksShoppingStore]AspNetCoreGeneratedDocument.*" \
            --exclude-by-file "**/*.cshtml;**/Views/*" &
          # wait for health
          for i in {1..30}; do curl -fsSL "http://127.0.0.1:5123/healthz" >/dev/null && echo up && break || sleep 1; done
          BASE_URL=http://127.0.0.1:5123 RUN_UI_TESTS=1 IGNORE_CERT_ERRORS=0 USE_TEST_FACTORY=0 \
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=UI-Smoke" --logger "trx;LogFileName=ui-coverage.trx"
          # stop server (coverlet target)
          pkill -f "SocksShoppingStore.dll" || true
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: |
            SocksShoppingStore.Tests/TestResults/Coverage
            **/coverage.opencover.xml
            coverage-ui/coverage.cobertura.xml
      - name: Upload TRX (non-UI + UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-main
          path: |
            SocksShoppingStore.Tests/TestResults/Coverage/main.trx
            SocksShoppingStore.Tests/TestResults/UI/ui.trx

  deploy-azure:
    name: Deploy to Azure App Service
    if: github.ref == 'refs/heads/main'
    needs: main-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish app (Release)
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet publish SocksShoppingStore/SocksShoppingStore.csproj -c Release -o ./publish
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: './publish'

  manual-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: |
          dotnet restore SocksShoppingStore/SocksShoppingStore.csproj
          dotnet restore SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj
      - name: Start app (HTTP)
        run: |
          dotnet build SocksShoppingStore/SocksShoppingStore.csproj -c Release
          nohup bash -c "dotnet run -c Release --project SocksShoppingStore/SocksShoppingStore.csproj --urls http://127.0.0.1:5123 --no-launch-profile" > app.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then echo up; break; fi
            sleep 1
          done
          if ! curl -fsS "http://127.0.0.1:5123/healthz" >/dev/null; then
            echo 'App failed to start'; echo '--- app.log (tail) ---'; tail -n 200 app.log || true; exit 1;
          fi
      - name: Run UI smoke tests
        env:
          BASE_URL: http://127.0.0.1:5123
          RUN_UI_TESTS: '1'
          IGNORE_CERT_ERRORS: '0'
        run: |
          dotnet test SocksShoppingStore.Tests/SocksShoppingStore.Tests.csproj -c Release --filter "TestCategory=UI-Smoke" --logger "trx;LogFileName=ui.trx"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: |
            allure-results
            **/allure-results
